name: verify

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate:data
      # Semantic invariants run in report-only mode while the existing
      # registry data is cleaned up, so this job stays green on merge.
      # Switch to "npm run verify" to make the invariants blocking.
      - run: npm run validate:invariants:report
